# Replace budget.example.edu with your real domain. Add HTTPS before using
# SESSION_COOKIE_SECURE=1 in a browser. Do not expose the Gunicorn port publicly.
server {
    listen 80;
    server_name budget.example.edu;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 130s;
    }
    # Never add a static alias for instance/, .env, backup files or receipt images.
}
