{% set max_value=(s.daily|map(attribute='1')|list|max)|float %}<div class="spend-chart" role="img" aria-label="Recorded expenses over the last 30 days">{% for day,total in s.daily %}<div class="bar-wrap" title="{{ day }}: {{ money(total) }}"><div style="height:{{ total|float/max_value*100 if max_value else 0 }}%"></div></div>{% endfor %}</div><div class="chart-axis"><span>{{ s.daily[0][0] }}</span><span>{{ s.daily[-1][0] }}</span></div>
