<div class="map-block"><link rel="stylesheet" href="{{ url_for('static',filename='leaflet/leaflet.css') }}"><div class="map" id="campus-map" data-lat="{{ setting('latitude') }}" data-lng="{{ setting('longitude') }}" data-address="{{ setting('company_address') }}"></div><div class="map-controls"><div><strong>{{ setting('company_name') }}</strong><p>{{ setting('company_address') }}</p><output id="map-distance" aria-live="polite">Use your location to estimate straight-line distance to campus.</output></div><div class="actions"><button type="button" class="btn" id="map-locate">Use my location</button><button type="button" class="btn outline" id="map-reset">Reset</button><a class="btn outline" href="https://www.google.com/maps/dir/?api=1&destination={{ setting('latitude') }},{{ setting('longitude') }}" target="_blank" rel="noopener noreferrer">Directions ↗</a></div></div><small class="muted">Map tiles require internet; geolocation requires HTTPS or localhost and your permission. Distance is straight-line, not road travel distance.</small></div><script src="{{ url_for('static',filename='leaflet/leaflet.js') }}" defer></script><script src="{{ url_for('static',filename='js/map.js') }}" defer></script>
