{% extends 'base.html' %}{% set public=true %}{% block content %}<section class="landing-section"><div class="page-head"><div><div class="eyebrow">Campus life</div><h1>{{ album.title }}</h1><p>{{ album.description }}</p></div><a href="/#galleries" class="btn outline">All galleries</a></div><div class="gallery-grid">{% for item in images %}<figure><a href="{{ image_url(item.image) }}" target="_blank" rel="noopener"><img src="{{ image_url(item.image) }}" alt="{{ item.caption or album.title }}" loading="lazy"></a><figcaption>{{ item.caption }}</figcaption></figure>{% else %}<p>No photos yet.</p>{% endfor %}</div></section>{% endblock %}
