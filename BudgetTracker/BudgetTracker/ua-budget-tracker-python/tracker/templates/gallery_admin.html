{% extends 'base.html' %}{% from '_forms.html' import token with context %}{% block content %}<div class="page-head"><div><h1>{{ gallery.title }} · Photos</h1><p>Upload images, set the display order and choose the album cover.</p></div><a class="btn outline" href="/admin/galleries">Close</a></div><form method="post" enctype="multipart/form-data" class="card editor stack">{{ token() }}<label>Image<input type="file" name="image" accept="image/*" required data-image-preview></label><label>Caption<input name="caption" maxlength="190"></label><label>Sort order<input type="number" name="sort_order" value="0" min="0"></label><button class="btn" name="action" value="upload">Upload photo</button></form><div class="gallery-grid">{% for image in images %}<article class="card feature-card"><img src="{{ image_url(image.image) }}" alt="{{ image.caption }}"><form method="post" class="stack">{{ token() }}<input type="hidden" name="id" value="{{ image.id }}"><label>Caption<input name="caption" maxlength="190" value="{{ image.caption or '' }}"></label><label>Sort order<input name="sort_order" type="number" min="0" max="100000" value="{{ image.sort_order }}"></label><button class="btn small outline" name="action" value="edit">Save caption & order</button></form><form method="post" class="actions">{{ token() }}<input type="hidden" name="id" value="{{ image.id }}"><button class="btn small outline" name="action" value="cover">Use as cover</button><button class="btn small danger" name="action" value="delete">Delete</button></form></article>{% endfor %}</div>{% endblock %}
