<table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Payee</th><th>Amount</th></tr></thead><tbody>{% for e in s.entries %}<tr><td>{{ e.expense_date }}</td><td>{{ e.category.name if e.category else 'Uncategorised' }}</td><td>{{ e.description }}</td><td>{{ e.payee or '—' }}</td><td>{{ money(e.amount) }}</td></tr>{% else %}<tr><td colspan="5">No recorded expenses in this range.</td></tr>{% endfor %}</tbody></table>
